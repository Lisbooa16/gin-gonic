name: Pre-commit Checks

on:
  pull_request:
    branches:
      - Main
  push:
    branches:
      - Main

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.20  # Substitua pela versão do Go usada no projeto

      - name: Install pre-commit
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip  # Instalar o pip para poder instalar pre-commit
          pip3 install pre-commit

      - name: Install pre-commit hooks
        run: |
          pre-commit install
          pre-commit install-hooks

      - name: Run pre-commit hooks
        run: pre-commit run --all-files